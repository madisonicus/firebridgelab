# US federal tax parameters for tax year 2026.
#
# The engine runs in real (today's) dollars and holds these values fixed in
# real terms for the whole plan (docs/adr/0004-real-dollar-engine.md). A yearly
# refresh is an edit of this file (or a new federal_<year>.toml plus the
# TAX_YEAR constant in params.py). Every number below is read by
# firebridgelab/tax/core.py or firebridgelab/tax/rmd.py; nothing is duplicated
# in code.
#
# Brackets are [upper bound of taxable income, marginal rate] pairs in
# ascending order; the last upper bound is inf.

year = 2026
source = "IRS Rev. Proc. 2025-32 (2026 inflation adjustments); IRC sections cited per table"

[mfj]
source = "Rev. Proc. 2025-32 sec. 4 (IRC 1(j)(2)(A) brackets, 63(c) standard deduction, 63(f) additional amount, 1(j)(5) capital-gain breakpoints)"
ordinary_brackets = [
    [24_800.0, 0.10],
    [100_800.0, 0.12],
    [211_400.0, 0.22],
    [403_550.0, 0.24],
    [512_450.0, 0.32],
    [768_700.0, 0.35],
    [inf, 0.37],
]
standard_deduction = 32_200.0
# Per person aged 65 or older.
additional_deduction_65_plus = 1_650.0
# Long-term capital gains stack on top of ordinary taxable income.
ltcg_breakpoints = [
    [98_900.0, 0.00],
    [613_700.0, 0.15],
    [inf, 0.20],
]
# IRC 1411(b); fixed in law, not indexed.
niit_threshold = 250_000.0

[single]
source = "Rev. Proc. 2025-32 sec. 4 (IRC 1(j)(2)(C) brackets, 63(c) standard deduction, 63(f) additional amount, 1(j)(5) capital-gain breakpoints)"
ordinary_brackets = [
    [12_400.0, 0.10],
    [50_400.0, 0.12],
    [105_700.0, 0.22],
    [201_775.0, 0.24],
    [256_225.0, 0.32],
    [640_600.0, 0.35],
    [inf, 0.37],
]
standard_deduction = 16_100.0
additional_deduction_65_plus = 2_050.0
ltcg_breakpoints = [
    [49_450.0, 0.00],
    [545_500.0, 0.15],
    [inf, 0.20],
]
# IRC 1411(b); fixed in law, not indexed.
niit_threshold = 200_000.0

[niit]
source = "IRC 1411(a)"
rate = 0.038

[early_withdrawal]
source = "IRC 72(t)(1): 10% additional tax on qualified-plan / IRA distributions before age 59 1/2"
penalty_rate = 0.10

[rmd]
source = "IRC 401(a)(9)(C)(v) as amended by SECURE 2.0 sec. 107 (age 75 for those born 1960 or later); Uniform Lifetime Table, Treas. Reg. 1.401(a)(9)-9(c), IRS Pub. 590-B Appendix B Table III"
start_age = 75
